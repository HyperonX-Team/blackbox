name: Deploy docs to GitHub Pages

# Publishes docs-site/ to the `gh-pages` branch.
#
# Why branch-based instead of actions/deploy-pages: the `github-pages`
# environment can carry a "deployment branches" protection rule that rejects
# pushes from `main` ("Branch 'main' is not allowed to deploy to github-pages").
# Pushing a plain `gh-pages` branch with GITHUB_TOKEN avoids that environment
# entirely and works on every repository configuration.
#
# One-time setup: Settings -> Pages -> Build and deployment ->
#   Source = "Deploy from a branch", Branch = `gh-pages` / `(root)`.

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish docs-site to the gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd docs-site
          touch .nojekyll
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy docs-site from ${GITHUB_SHA::7}"
          git branch -M gh-pages
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin gh-pages
