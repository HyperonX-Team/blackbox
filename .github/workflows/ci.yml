name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"   # nightly: full suite incl. runtime provisioning
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install (dev extra pulls pytest + pyinstaller + build)
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Fast suite (no runtime downloads; PR-friendly)
        if: github.event_name == 'pull_request'
        run: python -m pytest -m "not heavy"

      - name: Full suite (provisions real Python/Node runtimes; main + nightly)
        if: github.event_name != 'pull_request'
        run: python -m pytest

      - name: Doctor report (diagnostics on failure)
        if: failure()
        run: blackbox doctor

  exe-build-check:
    name: Standalone binary builds + smoke (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04   # older glibc -> runs on RHEL7-era distros too
          - os: macos-14
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install + build PyInstaller binary
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
          python -m PyInstaller --noconfirm packaging/blackbox.spec

      - name: Smoke the standalone binary (init -> pack -> run -> deps -> dedup)
        run: python packaging/smoke.py

  package:
    name: sdist + wheel build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build distribution
        run: |
          python -m pip install -U pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdist-wheel
          path: dist/*
