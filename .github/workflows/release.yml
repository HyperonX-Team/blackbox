name: Release

# Automatic releases of the Rust `blackbox` single-binary CLI.
#
#   * every push to main      -> prerelease-style build  v<crate>-build.<run>
#   * every tag push  v*      -> versioned release (must match Cargo.toml)
#   * workflow_dispatch       -> build-only (artifacts, no release), or pass
#                                create_tag=true to cut a tag from Cargo version
#
# Each release carries one native binary per platform (+ SHA256SUMS) and
# per-platform example `.blackbox` appliances packed BY that binary.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      create_tag:
        description: "Create + push tag v<Cargo.toml version> and release it"
        required: false
        default: "false"

permissions:
  contents: write   # create releases + upload assets (+ push auto tag)
  issues: write     # CI self-reporting of smoke failures

concurrency:
  group: release-${{ github.ref }}-v3
  cancel-in-progress: false

jobs:
  # 1. Build the self-contained Rust CLI binary for each platform.
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04      # older glibc => broad Linux compatibility
            asset: blackbox-linux-x86_64
            out: blackbox
            gui_asset: blackbox-gui-linux-x86_64
          - os: ubuntu-22.04-arm  # Linux ARM64 (free arm runner on public repos)
            asset: blackbox-linux-aarch64
            out: blackbox
            gui_asset: blackbox-gui-linux-aarch64
          - os: macos-14          # primary mac target: Apple Silicon (ARM64)
            asset: blackbox-macos-aarch64
            out: blackbox
            gui_asset: blackbox-gui-macos-aarch64
          # note: no free Intel macOS runner exists for this repo (macos-13 stays
          # queued forever), so x86_64 macOS binaries are not produced.
          - os: windows-latest
            asset: blackbox-windows-x86_64.exe
            out: blackbox.exe
            gui_asset: blackbox-gui-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GUI build deps (egui/eframe)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev

      - name: Crate version
        id: crate
        shell: bash
        run: |
          ver=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n 1)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "crate version: $ver"

      - name: Build release binary
        run: cargo build --locked --release

      - name: Smoke the binary before shipping it (offline-safe)
        shell: bash
        run: |
          set -o pipefail
          BB="$(pwd)/target/release/${{ matrix.out }}"
          "$BB" --version
          "$BB" doctor
          rm -rf /tmp/bb-smoke && mkdir -p /tmp/bb-smoke && cd /tmp/bb-smoke
          "$BB" init smokehello --template hello
          "$BB" pack smokehello
          # pack <path> writes the artifact beside the source tree
          "$BB" verify smokehello/smokehello.blackbox
          "$BB" inspect smokehello/smokehello.blackbox
          echo "smoke OK"

      - name: Report failure logs (self-debugging)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "=== rust toolchain ==="
            rustc --version; cargo --version
            echo "=== checkout sanity ==="
            git rev-parse HEAD
            ls -la src/ | head -n 20
            echo "=== workspace ==="
            grep -E "^(name|version)" Cargo.toml | head -n 5
          } > dbg.txt 2>&1 || true
          tail -c 60000 dbg.txt > tail.txt || cp dbg.txt tail.txt
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "ci failure: ${{ matrix.os }} run ${{ github.run_id }}" \
            --body-file tail.txt || true

      - name: Rename to platform asset
        shell: bash
        run: cp "target/release/${{ matrix.out }}" "${{ matrix.asset }}"

      - name: Build GUI release binary
        run: cargo build --locked --release --features gui --bin blackbox-gui

      - name: Rename GUI to platform asset
        shell: bash
        run: |
          GUI=target/release/blackbox-gui
          if [ ! -f "$GUI" ]; then GUI=target/release/blackbox-gui.exe; fi
          cp "$GUI" "${{ matrix.gui_asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.gui_asset }}
          path: ${{ matrix.gui_asset }}

  # 1b. Linux packages: .deb (CLI + GUI) and a portable .tar.gz.
  package-linux:
    name: Linux packages (${{ matrix.arch }})
    needs: build-binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64
            cli: blackbox-linux-x86_64
            gui: blackbox-gui-linux-x86_64
          - os: ubuntu-22.04-arm
            arch: arm64
            cli: blackbox-linux-aarch64
            gui: blackbox-gui-linux-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.cli }}
          path: dl/cli

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.gui }}
          path: dl/gui

      - name: Crate version
        id: v
        shell: bash
        run: echo "v=$(sed -n 's/^version *= *\"\(.*\)\"/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Build .deb (CLI)
        shell: bash
        run: |
          bash packaging/make-deb.sh blackbox "${{ steps.v.outputs.v }}" \
            "${{ matrix.arch }}" "dl/cli/${{ matrix.cli }}"

      - name: Build .deb (GUI)
        shell: bash
        run: |
          bash packaging/make-deb.sh blackbox-gui "${{ steps.v.outputs.v }}" \
            "${{ matrix.arch }}" "dl/gui/${{ matrix.gui }}" \
            packaging/blackbox-gui.desktop docs/assets/blackbox-logo.svg

      - name: Build portable .tar.gz
        shell: bash
        run: |
          set -euo pipefail
          d="blackbox-linux-${{ matrix.arch }}"
          mkdir -p "$d"
          cp "dl/cli/${{ matrix.cli }}" "$d/blackbox"
          cp "dl/gui/${{ matrix.gui }}" "$d/blackbox-gui"
          chmod +x "$d/blackbox" "$d/blackbox-gui"
          tar -czf "blackbox-linux-${{ matrix.arch }}.tar.gz" "$d"
          ls -l "$d" "blackbox-linux-${{ matrix.arch }}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-pkgs-${{ matrix.arch }}
          path: |
            *.deb
            *.tar.gz

  # 1c. macOS + Windows portable archives (no installer tooling needed).
  package-other:
    name: Archive (${{ matrix.name }})
    needs: build-binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos-aarch64
            cli: blackbox-macos-aarch64
            gui: blackbox-gui-macos-aarch64
            kind: tar
          - os: windows-latest
            name: windows-x86_64
            cli: blackbox-windows-x86_64.exe
            gui: blackbox-gui-windows-x86_64.exe
            kind: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.cli }}
          path: dl/cli

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.gui }}
          path: dl/gui

      - name: Assemble .tar.gz (macOS)
        if: matrix.kind == 'tar'
        shell: bash
        run: |
          set -euo pipefail
          d="blackbox-${{ matrix.name }}"
          mkdir -p "$d"
          cp "dl/cli/${{ matrix.cli }}" "$d/blackbox"
          cp "dl/gui/${{ matrix.gui }}" "$d/blackbox-gui"
          chmod +x "$d/blackbox" "$d/blackbox-gui"
          tar -czf "blackbox-${{ matrix.name }}.tar.gz" "$d"
          ls -l "blackbox-${{ matrix.name }}.tar.gz"

      - name: Assemble .zip (Windows)
        if: matrix.kind == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "pkg" | Out-Null
          Copy-Item "dl/cli/${{ matrix.cli }}" "pkg/blackbox.exe"
          Copy-Item "dl/gui/${{ matrix.gui }}" "pkg/blackbox-gui.exe"
          Compress-Archive -Path "pkg/*" -DestinationPath "blackbox-${{ matrix.name }}.zip" -Force
          Get-ChildItem "blackbox-${{ matrix.name }}.zip" | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: other-pkgs-${{ matrix.name }}
          path: |
            *.tar.gz
            *.zip

  # 1d. Distributable installers that put the programs on the PATH.
  package-installers:
    name: Installer (${{ matrix.name }})
    needs: build-binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: rpm-x86_64
            kind: rpm
            arch: x86_64
            cli: blackbox-linux-x86_64
            gui: blackbox-gui-linux-x86_64
          - os: ubuntu-22.04-arm
            name: rpm-aarch64
            kind: rpm
            arch: aarch64
            cli: blackbox-linux-aarch64
            gui: blackbox-gui-linux-aarch64
          - os: macos-14
            name: macos-pkg
            kind: pkg
            cli: blackbox-macos-aarch64
            gui: blackbox-gui-macos-aarch64
          - os: windows-latest
            name: windows-setup
            kind: inno
            cli: blackbox-windows-x86_64.exe
            gui: blackbox-gui-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.cli }}
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.gui }}
          path: dist/gui

      - name: Crate version
        id: v
        shell: bash
        run: echo "v=$(sed -n 's/^version *= *\"\(.*\)\"/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Install rpm tooling
        if: matrix.kind == 'rpm'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build RPM
        if: matrix.kind == 'rpm'
        shell: bash
        run: |
          set -euo pipefail
          bash packaging/rpm/build-rpm.sh "${{ steps.v.outputs.v }}" "${{ matrix.arch }}" \
            "dist/${{ matrix.cli }}" "dist/gui/${{ matrix.gui }}" \
            packaging/blackbox-gui.desktop docs/assets/blackbox-logo.svg
          mkdir -p out
          mv ./*.rpm out/

      - name: Build macOS pkg
        if: matrix.kind == 'pkg'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          bash packaging/macos/build-pkg.sh "${{ steps.v.outputs.v }}" \
            "dist/${{ matrix.cli }}" "dist/gui/${{ matrix.gui }}" \
            "out/blackbox-${{ steps.v.outputs.v }}-macos-aarch64.pkg"

      - name: Install Inno Setup
        if: matrix.kind == 'inno'
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        if: matrix.kind == 'inno'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $dist = Join-Path $root 'dist'
          $gui  = Join-Path $dist 'gui'
          $out  = Join-Path $root 'out'
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          Copy-Item (Join-Path $dist '${{ matrix.cli }}') (Join-Path $dist 'blackbox.exe') -Force
          Copy-Item (Join-Path $gui  '${{ matrix.gui }}') (Join-Path $dist 'blackbox-gui.exe') -Force

          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found after installing Inno Setup' }

          # StageDir and OutDir have to be absolute: Inno resolves relative
          # Source paths against the script directory, not the shell's cwd.
          & $iscc "/DAppVersion=${{ steps.v.outputs.v }}" "/DStageDir=$dist" "/DOutDir=$out" (Join-Path $root 'packaging\windows\blackbox.iss')
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

          Get-ChildItem $out
          if (-not (Test-Path (Join-Path $out 'blackbox-setup-windows-x86_64.exe'))) {
            throw 'the installer was not produced'
          }

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: out/*

  # 2. Build per-platform example .blackbox appliances USING the released binary.
  #    Best-effort: a flaky runtime download must never block the release.
  build-examples:
    needs: build-binaries
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: blackbox-linux-x86_64
            tag: linux-x86_64
          - os: ubuntu-22.04-arm
            asset: blackbox-linux-aarch64
            tag: linux-aarch64
          - os: macos-14
            asset: blackbox-macos-aarch64
            tag: macos-aarch64
          - os: windows-latest
            asset: blackbox-windows-x86_64.exe
            tag: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: bin

      - name: Make the binary executable
        shell: bash
        run: |
          chmod +x "bin/${{ matrix.asset }}" || true
          echo "BB=$(pwd)/bin/${{ matrix.asset }}" >> "$GITHUB_ENV"

      - name: Pack each example for this platform
        shell: bash
        run: |
          set -euo pipefail
          out="examples-${{ matrix.tag }}"
          mkdir -p "$out"
          for ex in datasift research-repro wordcount-node; do
            "$BB" pack "examples/$ex" -o "$out/$ex.blackbox"
            "$BB" verify "$out/$ex.blackbox"
          done
          ls -l "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: examples-${{ matrix.tag }}
          path: examples-${{ matrix.tag }}/*.blackbox

  # 3. Python sdist + wheel (for `pip install blackbox-runtime`, reference impl).
  build-wheel:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -U pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdist-wheel
          path: dist/*

  # 4. Aggregate everything into a GitHub Release.
  #    Runs as long as the core binaries built, even if example packing failed.
  release:
    needs: [build-binaries, package-linux, package-other, package-installers, build-examples, build-wheel]
    if: ${{ !cancelled() && needs.build-binaries.result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      # download-artifact nests each artifact in its own directory; `files: out/*`
      # does not recurse, so every artifact must be hoisted flat into out/ or its
      # contents are silently dropped from the release (the "missing .exe" bug).
      - name: Flatten artifacts
        run: |
          mkdir -p out
          shopt -s nullglob
          for d in artifacts/*/; do
            name=$(basename "$d")
            case "$name" in
              examples-*)
                plat="${name#examples-}"
                mkdir -p "out/.examples-$plat"
                cp -rL "$d". "out/.examples-$plat"/
                ;;
              *)
                find "$d" -maxdepth 3 -type f -exec mv {} out/ \; 2>/dev/null || true
                ;;
            esac
          done
          # tag per-platform example packages, then drop the staging dirs
          for d in out/.examples-*; do
            plat="${d#out/.examples-}"
            for f in "$d"/*.blackbox; do
              base=$(basename "$f" .blackbox)
              mv "$f" "out/${base}.${plat}.blackbox"
            done
            rm -rf "$d"
          done
          # ship the one-line installers as release assets too
          cp packaging/install.sh packaging/install.ps1 out/
          ls -R out

      - name: Compute release tag (+ stamp checksums)
        id: rtag
        shell: bash
        run: |
          ver=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            name="${GITHUB_REF#refs/tags/}"
            if [[ "$name" != "v$ver" ]]; then
              echo "::error::tag $name does not match Cargo.toml version $ver"
              exit 1
            fi
          elif [[ "${{ github.event.inputs.create_tag }}" == "true" ]]; then
            name="v$ver"
            git tag "$name" || true
            git push origin "$name"
          else
            # every push gets its own tagged release; run numbers are unique & monotonic
            name="v$ver-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          (
            cd out
            for f in *; do
              [ "$f" = "SHA256SUMS.txt" ] && continue
              sha256sum "$f"
            done > SHA256SUMS.txt
          )
          cat out/SHA256SUMS.txt

      - name: Write release notes
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## Download a machine

          Every platform ships **two** programs: the `blackbox` CLI and the
          `blackbox-gui` desktop app. Installers put both on your PATH.

          | Platform | Installer | Archives |
          |----------|-----------|----------|
          | Windows x86_64 | `blackbox-setup-windows-x86_64.exe` | `blackbox-windows-x86_64.zip` |
          | macOS (Apple Silicon) | `blackbox-<ver>-macos-aarch64.pkg` | `blackbox-macos-aarch64.tar.gz` |
          | Debian / Ubuntu | `blackbox_<ver>_amd64.deb` + `blackbox-gui_<ver>_amd64.deb` | `blackbox-linux-amd64.tar.gz` |
          | Fedora / RHEL / openSUSE | `blackbox-<ver>-1.x86_64.rpm` | `blackbox-linux-amd64.tar.gz` |
          | Any Linux / macOS | `install.sh` | `blackbox-linux-<arch>.tar.gz` |
          | Any Windows | `install.ps1` | `blackbox-windows-x86_64.zip` |

          ### One line

          ```sh
          # Linux and macOS
          curl -fsSL https://github.com/HyperonX-Team/blackbox/releases/latest/download/install.sh | sh
          ```

          ```powershell
          # Windows
          irm https://github.com/HyperonX-Team/blackbox/releases/latest/download/install.ps1 | iex
          ```

          ### Debian and Ubuntu

          ```bash
          sudo apt install ./blackbox_*_amd64.deb ./blackbox-gui_*_amd64.deb
          blackbox doctor
          ```

          ### macOS

          Open the `.pkg`, or unpack the tarball and put both files in `/usr/local/bin`.

          ### Windows

          Run `blackbox-setup-windows-x86_64.exe`. It installs per user, adds
          itself to your PATH and creates a Start Menu entry.

          Verify any download against `SHA256SUMS.txt`, then try a demo:

          ```bash
          blackbox init hello && cd hello && blackbox pack && blackbox run hello.blackbox
          ```

          ### Example appliances (`.blackbox`, per platform)

          Files are tagged by the platform they were packed for (native runtimes
          are platform specific).

          > Unsigned macOS binaries: first launch may need
          > `xattr -d com.apple.quarantine blackbox-macos-aarch64` (macOS Gatekeeper).
          > Code-signing and notarization are tracked on the roadmap.
          EOF
          cat RELEASE_NOTES.md

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rtag.outputs.name }}
        run: |
          set -euo pipefail

          # The GitHub API is occasionally degraded; publishing should ride
          # that out rather than fail a build that produced every artifact.
          retry() {
            attempt=0
            until "$@"; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 6 ]; then
                echo "gave up after $attempt attempts: $*" >&2
                return 1
              fi
              echo "attempt $attempt failed; retrying in $((attempt * 15))s" >&2
              sleep $((attempt * 15))
            done
          }

          # Create the release first and upload separately, so a retry after a
          # partial failure is idempotent (--clobber overwrites assets).
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            retry gh release create "$TAG" --title "BLACKBOX $TAG" --notes-file RELEASE_NOTES.md
          fi

          retry gh release upload "$TAG" out/* --clobber

          gh release view "$TAG" --json assets --jq '.assets[].name' | sort

  # 5. Optional PyPI publish via OIDC trusted publishing.
  #    Enable by: (a) creating the "pypi" environment, and (b) setting the
  #    repo variable PUBLISH_PYPI=true after registering the project on PyPI
  #    with GitHub Actions trusted publishing. No secrets/long-lived tokens.
  publish-pypi:
    # PyPI rejects re-uploads of the same version, so only publish on real
    # version tags — never on the per-push build releases.
    if: vars.PUBLISH_PYPI == 'true' && startsWith(github.ref, 'refs/tags/')
    needs: [build-wheel, release]
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/p/blackbox-runtime
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist-wheel
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://upload.pypi.org/legacy/
