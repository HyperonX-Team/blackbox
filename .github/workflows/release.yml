name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # create releases + upload assets
  issues: write     # CI self-reporting of smoke failures

concurrency:
  group: release-${{ github.ref }}-v2
  cancel-in-progress: false

jobs:
  # 1. Build a self-contained CLI binary for each platform with PyInstaller.
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04      # older glibc => broad Linux compatibility
            asset: blackbox-linux-x86_64
            out: blackbox
          - os: ubuntu-22.04-arm  # Linux ARM64 (free arm runner on public repos)
            asset: blackbox-linux-aarch64
            out: blackbox
          - os: macos-14          # primary mac target: Apple Silicon (ARM64)
            asset: blackbox-macos-aarch64
            out: blackbox
          # note: no free Intel macOS runner exists for this repo (macos-13 stays
          # queued forever), so x86_64 macOS binaries are not produced.
          - os: windows-latest
            asset: blackbox-windows-x86_64.exe
            out: blackbox.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install toolchain (PyInstaller lives in the dev extra)
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Build standalone binary
        run: python -m PyInstaller --noconfirm packaging/blackbox.spec

      - name: Smoke the binary before shipping it
        shell: bash
        run: |
          set -o pipefail
          python packaging/smoke.py "dist/${{ matrix.out }}" 2>&1 | tee smoke.log

      - name: Report smoke failure (self-debugging)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "smoke failure: ${{ matrix.os }} run ${{ github.run_id }}" \
            --body-file smoke.log || true

      - name: Rename to platform asset
        shell: bash
        run: mv "dist/${{ matrix.out }}" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  # 2. Build per-platform example .blackbox appliances USING the released binary.
  build-examples:
    needs: build-binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: blackbox-linux-x86_64
            tag: linux-x86_64
          - os: ubuntu-22.04-arm
            asset: blackbox-linux-aarch64
            tag: linux-aarch64
          - os: macos-14
            asset: blackbox-macos-aarch64
            tag: macos-aarch64
          - os: windows-latest
            asset: blackbox-windows-x86_64.exe
            tag: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: bin

      - name: Make the binary executable
        shell: bash
        run: |
          chmod +x "bin/${{ matrix.asset }}" || true
          echo "BB=$(pwd)/bin/${{ matrix.asset }}" >> "$GITHUB_ENV"

      - name: Pack each example for this platform
        shell: bash
        run: |
          set -euo pipefail
          out="examples-${{ matrix.tag }}"
          mkdir -p "$out"
          for ex in hello datasift research-repro; do
            "$BB" pack "examples/$ex" -o "$out/$ex.blackbox"
            "$BB" verify "$out/$ex.blackbox"
          done
          ls -l "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: examples-${{ matrix.tag }}
          path: examples-${{ matrix.tag }}/*.blackbox

  # 3. Python sdist + wheel (for `pip install blackbox-runtime`).
  build-wheel:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -U pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdist-wheel
          path: dist/*

  # 4. Aggregate everything into a GitHub Release.
  release:
    needs: [build-binaries, build-examples, build-wheel]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      # download-artifact nests each artifact in its own directory; `files: out/*`
      # does not recurse, so every artifact must be hoisted flat into out/ or its
      # contents are silently dropped from the release (the "missing .exe" bug).
      - name: Flatten artifacts
        run: |
          mkdir -p out
          shopt -s nullglob
          for d in artifacts/*/; do
            name=$(basename "$d")
            case "$name" in
              examples-*)
                plat="${name#examples-}"
                mkdir -p "out/.examples-$plat"
                cp -rL "$d". "out/.examples-$plat"/
                ;;
              *)
                find "$d" -maxdepth 3 -type f -exec mv {} out/ \; 2>/dev/null || true
                ;;
            esac
          done
          # tag per-platform example packages, then drop the staging dirs
          for d in out/.examples-*; do
            plat="${d#out/.examples-}"
            for f in "$d"/*.blackbox; do
              base=$(basename "$f" .blackbox)
              mv "$f" "out/${base}.${plat}.blackbox"
            done
            rm -rf "$d"
          done
          ls -R out

      - name: Compute release tag
        id: rtag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            # every push gets its own tagged release; run numbers are unique & monotonic
            echo "name=v0.1.0-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rtag.outputs.name }}
          name: BLACKBOX ${{ steps.rtag.outputs.name }}
          generate_release_notes: true
          files: out/*
          body: |
            ## Download a machine

            **Pick the `blackbox` binary for your OS**, make it executable, put it on your `PATH`:

            ```bash
            chmod +x blackbox-linux-x86_64   # or blackbox-macos-aarch64
            sudo install -m755 blackbox-linux-x86_64 /usr/local/bin/blackbox
            blackbox doctor
            ```

            Windows: rename `blackbox-windows-x86_64.exe` to `blackbox.exe`.

            Try a demo immediately (the binary carries its own Python; you install nothing else):

            ```bash
            blackbox init hello && cd hello && blackbox pack && blackbox run hello.blackbox
            ```

            ### Example appliances (`.blackbox`, per platform)
            Files are tagged by the platform they were packed for (native/runtimes
            are platform-specific). Node.js and native-runtime examples are built
            from source in CI on request.

            > Unsigned macOS/Linux binaries: first launch may need
            > `xattr -d com.apple.quarantine blackbox-macos-aarch64` (macOS Gatekeeper).
            > Code-signing / notarization is tracked on the roadmap.

  # 5. Optional PyPI publish via OIDC trusted publishing.
  #    Enable by: (a) creating the "pypi" environment, and (b) setting the
  #    repo variable PUBLISH_PYPI=true after registering the project on PyPI
  #    with GitHub Actions trusted publishing. No secrets/long-lived tokens.
  publish-pypi:
    # PyPI rejects re-uploads of the same version, so only publish on real
    # version tags — never on the per-push build releases.
    if: vars.PUBLISH_PYPI == 'true' && startsWith(github.ref, 'refs/tags/')
    needs: [build-wheel, release]
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/p/blackbox-runtime
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist-wheel
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://upload.pypi.org/legacy/
