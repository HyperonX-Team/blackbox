[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blackbox-runtime"
version = "0.1.0"
description = "BLACKBOX - Download a machine. Portable, reproducible computational appliances."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "The BLACKBOX Project" }]
keywords = ["packaging", "reproducibility", "sandbox", "portable", "runtime"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "PyYAML>=6.0",
    "cryptography>=41.0",
    "zstandard>=0.21",
    "certifi>=2023.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
blackbox = "blackbox.cli.main:main"

[project.optional-dependencies]
dev = ["pytest>=7", "pyinstaller>=6", "build>=1"]

[project.urls]
Homepage = "https://github.com/blackbox-project/blackbox"

[tool.setuptools.packages.find]
include = ["blackbox*"]

[tool.setuptools.package-data]
blackbox = [
    "sandbox/shim/*.py",
    "cli/templates/*",
    "cli/templates/*/*",
    "cli/templates/*/*/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "heavy: provisions/downloads real runtimes or needs network; skipped in fast CI, run nightly and pre-release",
]
