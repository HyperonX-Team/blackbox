<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bbbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242b23"/>
      <stop offset="1" stop-color="#070907"/>
    </linearGradient>
    <linearGradient id="bbbolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#54f08a"/>
      <stop offset="1" stop-color="#23c45e"/>
    </linearGradient>
  </defs>

  <!-- the machine -->
  <rect x="26" y="26" width="460" height="460" rx="112" fill="url(#bbbody)"
        stroke="#41503f" stroke-width="8"/>
  <!-- lid seam -->
  <line x1="70" y1="128" x2="442" y2="128" stroke="#ffffff" stroke-opacity="0.08"
        stroke-width="10" stroke-linecap="round"/>
  <!-- status LED -->
  <circle cx="412" cy="82" r="17" fill="url(#bbbolt)">
    <animate attributeName="opacity" values="1;0.45;1" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- download -->
  <rect x="232" y="152" width="48" height="118" rx="14" fill="url(#bbbolt)"/>
  <polygon points="198,252 314,252 256,332" fill="url(#bbbolt)"/>
  <!-- into the box: tray bar -->
  <rect x="168" y="352" width="176" height="34" rx="17" fill="url(#bbbolt)"/>
</svg>
